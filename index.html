<title>GadgiK</title>
<style>
:root{--green:#16883a;--green-dark:#0d6d2c;--green-soft:#edf7ef;--ink:#151a15;--muted:#6b746c;--line:rgba(22,76,34,.09);--bg:#f4f8f4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:radial-gradient(460px 320px at -8% 0%,rgba(56,185,82,.12),transparent 68%),radial-gradient(400px 320px at 110% 100%,rgba(22,136,58,.08),transparent 72%),linear-gradient(180deg,#fbfcfb 0%,#f2f7f3 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(rgba(22,89,37,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(22,89,37,.018) 1px,transparent 1px);background-size:38px 38px}

.panel{width:min(100%,460px);margin:0 auto}
.grid{display:block}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin:0 0 18px}
.logo{display:block;width:min(300px,78vw);height:auto;margin:0 auto 9px}
.tagline{margin:0;font-size:16px;line-height:1.18;font-weight:770;letter-spacing:-.025em;text-align:center;color:#242a24}
.brand-line{display:block;width:58px;height:4px;border-radius:999px;margin:10px auto 0;background:linear-gradient(90deg,#45c05d,var(--green))}
.shop{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:62px minmax(0,1fr) 42px;align-items:center;gap:14px;min-height:116px;padding:16px;border-radius:29px;color:#fff;text-decoration:none;background:linear-gradient(135deg,#2eaf4f 0%,#188a3c 48%,#0d6d2c 100%);box-shadow:0 18px 38px rgba(16,108,42,.20),inset 0 1px 0 rgba(255,255,255,.16);transition:transform .16s ease,box-shadow .16s ease}
.shop:active{transform:scale(.99)}
.shop:before{content:"";position:absolute;z-index:-1;width:180px;height:180px;left:-72px;top:-96px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.shop:after{content:"";position:absolute;z-index:-1;width:220px;height:220px;right:-118px;bottom:-146px;border-radius:50%;border:1px solid rgba(255,255,255,.13);box-shadow:0 0 0 26px rgba(255,255,255,.028),0 0 0 54px rgba(255,255,255,.018)}
.shop-icon{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.20)}
.shop-title{display:block;font-size:22px;line-height:1.06;font-weight:830;letter-spacing:-.035em}
.shop-sub{display:block;margin-top:7px;font-size:13px;line-height:1.16;color:rgba(255,255,255,.82);white-space:nowrap}
.shop-arrow{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.14)}
.section-head{display:flex;align-items:center;gap:12px;margin:20px 4px 12px}
.section-head h2{margin:0;font-size:19px;line-height:1.08;font-weight:840;letter-spacing:-.035em;white-space:nowrap}
.section-head:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(22,136,58,.24),rgba(22,136,58,0))}
.social-panel{overflow:hidden;border-radius:28px;border:1px solid var(--line);background:rgba(255,255,255,.80);box-shadow:0 15px 36px rgba(26,67,34,.06);backdrop-filter:blur(14px)}
.social-grid{display:grid;grid-template-columns:1fr 1fr}
.social{position:relative;overflow:hidden;min-height:148px;padding:17px;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;background:rgba(255,255,255,.34);transition:background .15s ease}
.social:nth-child(odd){border-right:1px solid var(--line)}.social:nth-child(-n+2){border-bottom:1px solid var(--line)}
.social:before{content:"";position:absolute;width:138px;height:138px;border-radius:50%;right:-82px;top:-86px;opacity:.12}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.icon{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.24)}
.ig{background:linear-gradient(135deg,#7048d8 0%,#d72f7a 44%,#f57d2c 78%,#ffd462 100%)}.tg{background:#2ca7df}.tt{background:#0d0d0f}.yt{background:#ff1515}
.go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.platform{display:block;font-size:21px;line-height:1.04;font-weight:820;letter-spacing:-.035em}
.handle{display:block;margin-top:7px;font-size:13px;line-height:1.12;color:var(--muted);font-weight:580}
.footer{margin-top:17px;display:flex;justify-content:center;color:var(--muted);font-size:12px}
.footer-brand{display:flex;align-items:center;gap:10px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px rgba(22,136,58,.08)}
a:focus-visible{outline:3px solid rgba(22,136,58,.28);outline-offset:3px}

@media(min-width:1600px){.panel{width:min(90vw,1480px);padding:58px 62px 30px}.grid{grid-template-columns:minmax(540px,.95fr) minmax(620px,1.05fr);gap:86px}.logo{width:450px}.tagline{font-size:27px}.shop{min-height:198px}.social{min-height:198px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
