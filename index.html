<style id="final-polish">
/* Final visual polish. The source logo contains unused canvas; crop it via object-fit instead of negative margins. */
.header{padding:4px 0 15px}
.logo{width:172px;max-width:52vw;height:46px;object-fit:cover;object-position:center bottom;margin:0 auto 10px}
.tagline{font-size:13.5px;line-height:1.2}
.brand-block:after{margin-top:9px}
.section-head{margin-top:22px}

}

  .tagline{font-size:14px}
  .brand-block:after{margin-top:9px}

  .shop-icon{width:72px;height:72px}
  .shop-title{font-size:25px}
  .shop-arrow{width:48px;height:48px}
  .section-head h2{font-size:22px}
  .social{min-height:154px;padding:22px}
  .icon{width:52px;height:52px}
  .platform{font-size:18px}
  .handle{font-size:12px}
  .footer{margin-top:30px;padding-top:18px;font-size:12px}
}

@media (min-width:1440px){

}

@media (min-width:800px) and (max-width:1023px) and (orientation:landscape){
